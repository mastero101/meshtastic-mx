<header class="header" [class.scrolled]="isScrolled">
  <div class="container header__inner">
    <a routerLink="/" class="logo" (click)="closeMobileMenu()" aria-label="Meshtastic México, ir al inicio">
      <span class="logo__text">Meshtastic <span class="logo__mx">México</span></span>
      <app-mx-flag class="logo__flag" [width]="28" />
    </a>

    <nav id="main-nav" class="nav" [class.mobile-open]="isMobileMenuOpen" aria-label="Principal">
      <div class="nav__mobile-head">
        <span class="logo__text">Meshtastic <span class="logo__mx">MX</span></span>
      </div>

      <ul class="nav__list">
        @for (link of links; track link.path) {
          <li>
            <a [routerLink]="link.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: link.exact }"
               (click)="closeMobileMenu()">
              <i class="fa-solid" [class]="link.icon" aria-hidden="true"></i> {{ link.label }}
            </a>
          </li>
        }
      </ul>

      <div class="nav__mobile-foot">
        <p>Síguenos</p>
        <div class="nav__socials">
          <a href="https://github.com/mastero101/meshtastic-mx" target="_blank" rel="noopener" aria-label="GitHub"><i class="fa-brands fa-github" aria-hidden="true"></i></a>
          <a href="https://t.me/meshtastic_mexico" target="_blank" rel="noopener" aria-label="Telegram"><i class="fa-brands fa-telegram" aria-hidden="true"></i></a>
        </div>
      </div>
    </nav>

    <div class="header__actions">
      <button type="button" class="icon-btn" (click)="themeService.toggle()"
              [attr.aria-label]="themeService.theme() === 'dark' ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'"
              [attr.title]="themeService.theme() === 'dark' ? 'Tema claro' : 'Tema oscuro'">
        <i class="fa-solid" [class.fa-sun]="themeService.theme() === 'dark'" [class.fa-moon]="themeService.theme() !== 'dark'" aria-hidden="true"></i>
      </button>

      <button type="button" class="icon-btn menu-toggle" [class.active]="isMobileMenuOpen" (click)="toggleMobileMenu()"
              aria-controls="main-nav" [attr.aria-expanded]="isMobileMenuOpen"
              [attr.aria-label]="isMobileMenuOpen ? 'Cerrar menú' : 'Abrir menú'">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>

  <div class="nav-backdrop" [class.active]="isMobileMenuOpen" (click)="closeMobileMenu()"></div>
</header>
