<div class="guides-page">
  <app-page-hero
    title="Guías para nuevos usuarios"
    subtitle="Aprende a usar Meshtastic paso a paso. Selecciona una guía para comenzar."
  />

  <div class="container">
    <nav class="guides-list" #guidesList aria-label="Guías">
      <div class="guides-grid">
        @for (guide of guides; track guide.path) {
          <a class="guide-card" [routerLink]="guide.path" routerLinkActive="active" ariaCurrentWhenActive="page">
            <span class="icon-tile icon-tile--lg" aria-hidden="true"><i class="fa-solid" [class]="guide.icon"></i></span>
            <span class="guide-card__info">
              <span class="guide-card__title">{{ guide.title }}</span>
              <span class="guide-card__text">{{ guide.text }}</span>
            </span>
          </a>
        }
      </div>
    </nav>

    <div class="guide-outlet" #guidesOutlet>
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
